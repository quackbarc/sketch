<link rel="import" href="../../bower_components/polymer/polymer.html">
<link rel="import" href="../../bower_components/iron-ajax/iron-ajax.html">

<dom-module id="sketch-api">
  <template>
    <iron-ajax
        id="getStatsRequest"
        url="[[getStatsURL]]"
        handle-as="json"
        on-response="_onGetStats"></iron-ajax>
    <iron-ajax
        id="swapRequest"
        url="[[swapURL]]"
        method="POST"
        timeout="30000"
        handle-as="text"
        on-response="_onSwap"
        on-error="_onSwapError"></iron-ajax>
    <iron-ajax
        id="getRequest"
        url="[[getURL]]"
        handle-as="json"
        on-response="_onGet"
        on-error="_onError"></iron-ajax>
  </template>
  <script>
  (function() {
    var GET_STATS_INTERVAL = 10000;
    var GET_INTERVAL = 10000;

    Polymer({
      is: 'sketch-api',

      ready: function() {
        this._getStats();
        setInterval(this._getStats.bind(this), GET_STATS_INTERVAL);
      },

      // Public properties

      properties: {
        getStatsURL: {
          type: String,
          readOnly: true,
          computed: "_getStatsURL(source)"
        },
        swapURL: {
          type: String,
          readOnly: true,
          computed: "_swapURL(source)"
        },
        getURL: {
          type: String,
          readOnly: true,
          computed: "_getURL(source)"
        },
        source: {
          // options: "noz.rip", "garyc.me"
          type: String,
          value: "noz.rip",
          observer: "_onSourceChange",
          notify: true,
        },
        captchaURL: {
          type: String,
          value: "https://noz.rip/sketch/captcha",
          notify: true,
          readOnly: true
        },
        useCaptcha: {
          type: Boolean,
          notify: true,
          computed: "_useCaptcha(source)"
        },
        loading: {
          type: Boolean,
          value: false,
          notify: true,
          readOnly: true
        },
        sketches: {
          type: Number,
          value: -1,
          notify: true,
          readOnly: true
        },
        artists: {
          type: Number,
          value: -1,
          notify: true,
          readOnly: true
        },
        peekers: {
          type: Number,
          value: -1,
          notify: true,
          readOnly: true
        }
      },

      // Private properties

      _waiting: false,

      _swapErroredOnce: false,

      // Computed properties

      _getStatsURL: function(source) {
        const urlmap = {
          "garyc.me": "https://garyc.me/sketch/getStats.php?details",
          "noz.rip": "https://noz.rip/sketch/stats",
        }
        return urlmap[source];
      },

      _swapURL: function(source) {
        const urlmap = {
          "garyc.me": "https://garyc.me/sketch/swap.php?v=32",
          "noz.rip": "https://noz.rip/sketch/swap",
        }
        return urlmap[source];
      },

      _getURL: function(source) {
        const urlmap = {
          "garyc.me": "https://garyc.me/sketch/get.php",
          "noz.rip": "https://noz.rip/sketch/data",
        }
        return urlmap[source];
      },

      _useCaptcha: function(source) {
        // Currently, this is always on for noz.rip.
        // There may be a chance that the captcha eventually gets taken down,
        // but there's no way to tell that automatically or through the wire.
        // It'll be manual source-code toggling in case that happens.
        return source == "noz.rip";
      },

      // Property observers

      _onSourceChange: function() {
        if(!this._readied) {
          return;
        }

        // Show "-" stat counts just because it's nice UX for changing galleries.
        this._setSketches(-1);
        this._setArtists(-1);
        this._setPeekers(-1);
        this._getStats();
      },

      // Public functions

      peek: function() {
        this.$.getRequest.params = {};
        this.$.getRequest.generateRequest();
        this._setLoading(true);
      },

      swap: function(data) {
        let contentType = null;
        if(this.source == "noz.rip") {
          contentType = "application/x-www-form-urlencoded";
        }

        this.$.swapRequest.body = data;
        this.$.swapRequest.contentType = contentType;
        this.$.swapRequest.generateRequest();
        this._setLoading(true);
      },

      swapWithCaptcha: function(sdata, phrase) {
        this.swap({data: sdata, phrase});
      },

      refreshCaptcha: function() {
        const now = Date.now();
        this._setCaptchaURL(`https://noz.rip/sketch/captcha?${now}`);
      },

      save: function(data) {
        var a = document.createElement('a');
        a.setAttribute('download', 'sketch.png');
        a.href = data;
        a.click();
      },

      saveTXT: function(data) {
        var a = document.createElement('a');
        a.setAttribute('download', 'sketch.txt');
        a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(data);
        a.click();
      },

      saveSVG: function(lines, renderType) {
        let path = lines.map(function(line) {
          const isDot = (line.length == 4
            && line[0] == line[2]
            && line[1] == line[3]
          );

          // override for screentones with gallery-style renderTypes
          if((renderType == "gallery" || renderType == "gallery-miter") && isDot) {
            return `M ${line[0]} ${line[1]} L ${line[0] + 2} ${line[1] + 2}`;
          }

          let p = [];
          for(let i = 0; i < line.length; i += 2) {
            let coords = line.slice(i, i+2);
            // if statement prevents single coords that
            // could break the SVG
            if(coords.length == 2) {
              p.push(i == 0 ? "M" : "L");
              p.push(coords.join(" "));
            }
          }
          return p.join(" ");
        });

        let linecap = "round";
        let linejoin = "round";

        if(renderType == "gallery") {
          linecap = "butt";
        }
        if(renderType == "gallery-miter") {
          linecap = "butt";
          linejoin = "miter";
        }

        var xml = (
            '<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">\n'
            + '  <rect width="800" height="600" fill="white"/>'
            + '  <path\n'
            + '    d="' + path.join(" ") + '"\n'
            + '    fill="none"\n'
            + '    stroke="black"\n'
            + '    stroke-width="3px"\n'
            + '    stroke-miterlimit="10"\n'
            + '    stroke-linecap="' + linecap + '"\n'
            + '    stroke-linejoin="' + linejoin + '"/>\n'
            + '</svg>'
        );

        var a = document.createElement('a');
        a.setAttribute('download', 'sketch.svg');
        a.href = 'data:image/svg+xml,' + encodeURIComponent(xml);
        a.click();
      },

      // Private functions

      _getStats: function() {
        if(document.visibilityState == 'visible') {
          this.$.getStatsRequest.generateRequest();
        }
      },

      _onGet: function(event) {
        const {data, id} = event.detail.response;

        if(data == "wait") {
          if(!this._waiting) {
            this.fire('swap-waiting');
          }
          this._waiting = true;
          setTimeout(this.$.getRequest.generateRequest.bind(this.$.getRequest), GET_INTERVAL);
        }
        else {
          this._waiting = false;
          this.fire('get', {data: data, id: id});
          this._setLoading(false);
        }
      },

      _onSwap: function(event) {
        if(this.useCaptcha) {
          this.refreshCaptcha();
        }

        const id = parseInt(event.detail.response);

        // We may get non-numeric responses from noz.rip, like a blank string,
        // or an error page in HTML. This could be caused by anything, so
        // these are logged for later debugging. Treat these as errors for now.
        if(Number.isNaN(id)) {
          console.error(
            `Invalid swap response from ${this.source}:`,
            event.detail.response
          );
          this._onError(event);
          return;
        }

        // On empty swaps (or maybe some other faulty form errors), garyc.me
        // sends a -1 as a "bad request" response.
        // This clashes with the cooldown syntax, so we'd make sure it's the
        // "bad request" response if we get it the second time around.
        if(id == -1 && this._swapErroredOnce) {
          this._swapErroredOnce = false;
          this._onError(event);
          return;
        }

        if(id < 0) {
          setTimeout(this.$.swapRequest.generateRequest.bind(this.$.swapRequest), (1 - id) * 1000);
        }
        else {
          this.$.getStatsRequest.generateRequest();
          this.$.getRequest.params = { id: id || "" };
          this.$.getRequest.generateRequest();
        }

        this._swapErroredOnce = id == -1;
      },

      _onGetStats: function(event) {
        const {sketches, artists, peekers} = event.detail.response;

        this._setSketches(sketches);
        this._setArtists(artists);
        this._setPeekers(peekers);
      },

      _onError: function(event) {
        this.fire('swap-failed', {
          swap: event.srcElement == this.$.swapRequest,
          captchaFailed: false,
          message: null,
        });
        this._setLoading(false);
      },

      _onSwapError: function(event) {
        const eventDetail = {
          swap: true,
          captchaFailed: false,
          message: null,
        };

        if(this.source == "noz.rip") {
          const status = this.$.swapRequest.lastError.status;
          switch(status) {
            case 400: {
              eventDetail.message = "this sketch was already sent!";
              break;
            }
            case 401: {
              eventDetail.captchaFailed = true;
              eventDetail.message = "incorrect captcha!";
              break;
            }
            case 403: {
              // Should we do something in this event?
              eventDetail.message = "can't swap; malformed characters in data";
              break;
            }
            case 429: {
              // What's the cooldown here?
              eventDetail.message = "you're swapping too fast!";
              break;
            }
          }

          if(this.useCaptcha) {
            this.refreshCaptcha();
          }
        }

        this.fire('swap-failed', eventDetail);
        this._setLoading(false);
      },
    });
  })();
  </script>
</dom-module>
