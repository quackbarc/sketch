<link rel="import" href="../../bower_components/iron-icons/iron-icons.html">

<dom-module id="sketch-app">
  <template>
    <style>
      /* General styles */

      :host {
        @apply(--layout-fit);
        @apply(--layout-vertical);
        --paper-slider-height: 4px;
        --paper-item-body-two-line-min-height: 0px;

        /* Prevents the app from being selectable by tablet pens and iOS Safari. */
        -webkit-user-select: none;
        user-select: none;
      }

      .content {
        flex-grow: 1;
        position: relative;
      }

      paper-fab {
        position: absolute;
        bottom: 16px;
        right: 16px;
      }

      zoom-container {
        /**
         * Prevent stock browser gestures on the canvas's background.
         * Don't want that to be a looming threat while drawing.
         */
        touch-action: none;
      }

      /* Toolbar styles */

      paper-toolbar paper-progress.fit {
        top: 0;
      }

      paper-toolbar .title {
        pointer-events: auto; /* allows tooltips when hovered on */
        margin: 0;
      }
      .title span {
        margin: 0px 8px;
        font-size: 20px;
        font-family: "Jost", "Roboto", "Noto", sans-serif;
        line-height: normal;
      }
      .title .stats {
        display: inline-block;
      }

      /* for hideStats */

      .title {
        display: flex;
      }
      .title .stats {
        margin-left: auto;
      }
      .title .stats span {
        /* really dumb workaround */
        margin-left: 3px;
      }

      paper-icon-button[toggles]:not([active]),
      paper-icon-button[disabled],
      paper-menu-button[disabled] {
        color: var(--dark-primary-color);
      }

      paper-menu-button {
        padding: 0;
      }
      paper-toolbar paper-menu-button {
        --paper-menu-button-content: {
          max-height: 300px;
          border-radius: 4px;

          /**
           * Force a scrollbar to appear all the time.
           * This is mainly here to help <iron-dropdown> with calculating
           * the final dropdown width including the scrollbar; without it
           * (i.e. on `overflow-y: auto`), it's not good at automatically
           * assuming whether there's gonna be a scrollbar or not.
           **/
          overflow-y: scroll !important;

          /**
           * Take out any positioning-related offsets caused by
           * [vertical-align="bottom"].
           **/
          bottom: 0 !important;
          margin-top: 0 !important;
          margin-bottom: 0 !important;
        };
      }

      #mini-stats {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;

        align-self: stretch;
        flex: 0 0 auto;

        margin: 8px 0;
        overflow: hidden;
      }

      .mini-stats-block {
        width: min-content;
        box-sizing: border-box;
        min-width: 40px;

        padding: 0px 4px;
        border-radius: 3px;
        border: 1px solid #fff;

        font-family: "Jost", "Roboto", "Noto", sans-serif;
        font-size: 16px;
        text-align: center;
      }

      .mini-stats-block.white {
        background-color: #fff;
        color: #980706;
      }

      #toolbar.alertOnly paper-icon-button,
      #toolbar.alertOnly paper-menu-button,
      #toolbar.alertOnly .title > *:not(#alert) {
        display: none;
      }

      /* Settings styles */

      iron-icon.flipped {
        transform: scaleX(-1);
      }

      paper-toggle-button {
        /* Remove the spacing dedicated to labels within the button */
        --paper-toggle-button-label-spacing: 0px;
      }

      paper-dropdown-menu {
        --paper-input-container-input: {
            padding: 0px 4px;
            cursor: pointer;
        };
      }

      paper-dropdown-menu paper-item,
      paper-dropdown-menu paper-icon-item {
        cursor: pointer;

        padding: 8px 16px;
        min-height: 0px;
        max-width: 300px;
      }

      paper-item,
      paper-icon-item {
        padding: 8px 16px;
        min-height: 24px;
        min-width: 180px;

        display: flex;
        gap: 16px;
      }

      paper-icon-item {
        /* Remove the icons' stock width of 56px */
        --paper-item-icon-width: auto;
      }

      paper-icon-item.button-item {
        cursor: pointer;
      }

      paper-item-body [secondary] {
        white-space: normal;
      }

      .settings, .menu {
        font-family: 'Roboto', 'Noto', sans-serif;
        font-size: 16px;
        color: #000;
        padding: 8px;
        width: min-content;

        /**
         * Re-allow selections from tablet pens and iOS Safari.
         * It's text, so why not?
         */
        -webkit-user-select: text;
        user-select: text;
      }

      .settings h3,
      .menu h3 {
        text-transform: uppercase;
        color: #aaa;
        font-size: 14px;
        letter-spacing: 2px;

        padding: 12px 16px 4px;
        margin: 0px;
      }

      .settings hr {
        border: none;
        border-top: 1px solid #ccc;
      }

      .settings paper-icon-button[disabled] {
        color: var(--disabled-text-color);
      }

      .settings .settings-item {
        display: flex;
        align-items: center;
        gap: 16px;

        min-width: 400px;
        max-width: 450px;
      }

      .settings .settings-item > div:first-child,
      .settings .settings-item > paper-item-body {
        flex: 1;
      }

      .settings .settings-item > paper-slider {
        width: 210px;
      }

      .settings .settings-item > paper-dropdown-menu {
        width: 195px;
      }

      .settings .settings-double {
        display: flex;
        min-width: 410px;
        max-width: 450px;
      }

      .settings .settings-double .settings-item {
        flex: 1;

        min-width: 0;
        gap: 8px;
      }

      .settings-double .settings-item > div,
      .settings-double .settings-item > paper-item-body {
        flex: 0 1 auto;
      }

      .settings-double .settings-item > paper-slider {
        flex: 1 0 auto;

        width: 100px;
        max-width: 210px;
      }

      .settings .settings-double .settings-item:first-child {
        padding-right: 12px;
      }

      .settings .settings-double .settings-item:last-child {
        padding-left: 12px;
      }

      .zoom-buttons {
        display: flex;
        gap: 8px;
      }

      .zoom-buttons paper-input {
        text-align: center;
        width: 4.5rem;
      }

      :host[compact-buttons] .settings .button-row {
        display: flex;
        justify-content: center;

        padding: 0px 10px;
      }

      :host[compact-buttons] .settings .button-row .button-item {
        display: inline-block;
        min-width: unset;
        min-height: unset;

        padding: 8px;
      }

      :host[compact-buttons] .settings .button-row .button-item > * {
        /**
         * The * selector here applies to everything except the icon.
         * The icon is under <paper-icon-item>'s scope.
         */
        display: none;
      }

      /* Big settings styles */

      .settings-list h3 {
        text-transform: uppercase;
        color: #aaa;
        font-size: 14px;
        letter-spacing: 2px;

        padding: 16px 8px 4px;
        margin: 0px;
      }

      .settings-list h3:first-child {
        padding-top: 8px;
      }

      .settings-list hr {
        border: none;
        border-top: 1px solid #ccc;
      }

      .settings-list .settings-item {
        display: flex;
        align-items: center;
        gap: 20px;

        padding: 10px 8px;
        min-height: 48px;
        min-width: 300px;
        max-width: none;
      }

      .settings-list .settings-item > paper-dropdown-menu {
        width: 215px;
      }

      .settings-list .settings-item > paper-slider {
        width: 230px;
      }

      /* paper-dialog */

      paper-dialog {
        overflow-wrap: anywhere;
        font-size: 16px;
        margin: 24px 16px;
        border-radius: 4px;

        /**
         * (max viewport width - the 16px side margins)
         * I don't think there's any other way to make a container
         * with a base width that can shrink down to fit the viewport
         * while still respecting margins.
         **/
        max-width: calc(100% - 32px);
        width: 600px;

        -webkit-user-select: text;
        user-select: text;
      }

      paper-dialog > h2 {
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 24px;

        /* Revert paper-dialog's styling of `nowrap` */
        white-space: normal;
      }

      paper-dialog .markdown-html hr {
        border: none;
        border-top: 1px solid #ccc;
      }

      paper-dialog .markdown-html li {
        margin-block: 0.25em;
      }

      paper-dialog .markdown-html img {
        width: 100%;
      }

      paper-dialog .markdown-html h3 {
        margin: 1em 0px 0.5em;
      }

      paper-dialog .markdown-html table {
        width: 100%;
        max-width: 600px;
        table-layout: fixed;
        border-spacing: 1em 0.5em;
        line-height: 1.2em;
      }

      paper-dialog .markdown-html table th:nth-child(1) {
        width: 30%;
      }

      paper-input {
        min-height: 48px;
      }

      #keybindDialog code {
        background-color: #0001;
        padding: 2px 5px;
        border: 2px solid #0003;
        border-radius: 5px;
      }

      #changelogs hr.version-separator {
        margin: 2em 0;
      }

      #changelogs h1.version-name {
        text-align: center;
        font-family: "Jost", "Roboto", "Noto", sans-serif;
        margin-block-end: 0;
      }

      #changelogs p:has(.version-timestamp) {
        text-align: center;
      }

      #changelogs img {
        @apply(--shadow-elevation-2dp);
      }

      #captchaDialog {
        width: 350px;
      }

      #captchaDialog paper-button {
        --paper-button: {
          min-width: 0;
        };
      }

      #captchaDialog .captcha-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      #captchaDialog .captcha-card img {
        @apply(--shadow-elevation-2dp);

        width: 100%;
        aspect-ratio: 15/4;
      }

      #captchaDialog .captcha-card paper-input {
        flex: 1;
        width: 100%;

        --paper-input-container-input: {
          @apply(--paper-font-common-code);
        }
      }

      #captchaDialog .inverted {
        filter: invert(1);
      }

      /* Toasts */

      paper-dialog.toast {
        position: absolute;
        bottom: 16px;
        margin: 0px 16px;

        background-color: #111;
        color: #fff;
        border-radius: 4px;
        width: fit-content;

        font-family: "Jost", "Roboto", "Noto", sans-serif;
        font-size: 1.3em;
        user-select: none;
      }

      paper-dialog.toast > * {
        display: block;
        margin: 0;
        padding: 12px 16px;
      }

      /* paper-menu-button sizing fix */

      #toolbar paper-menu-button {
        box-sizing: border-box;
        width: 40px;
        height: 40px;
        /* move padding to paper-menu-button so its content size remains
           consistent with the other paper-icons, for icon resizability
           and proper flex calculation.
           the unfortunate side-effect of this would be that since a
           paper-icon's ripple effect is localized to paper-icon, the
           ripple's gonna be smaller. */
        padding: 8px;
        /* properly center paper-icons on chrome.
           the problem actually lies in #trigger's height but there's
           no mix-in for that */
        display: flex;
      }
      #toolbar paper-menu-button paper-icon-button.dropdown-trigger {
        padding: 0px;
        width: 100%;
        height: 100%;
      }

      /* Toolbar positioning styles */

      :host[toolbar-position="left"],
      :host[toolbar-position="right"] {
        --vertical-toolbar-width: 56px;

        --paper-toolbar-height: 100dvh;
        --paper-toolbar-sm-height: 100dvh;

        --paper-toolbar-content: {
          flex-direction: column;

          box-sizing: border-box;
          width: var(--vertical-toolbar-width);
          padding: 16px 0px;

          overflow-y: auto;
          scrollbar-width: none;
        };
      }

      :host[toolbar-position="top"] {
        flex-direction: column-reverse;
      }

      :host[toolbar-position="left"] {
        flex-direction: row-reverse;
      }

      :host[toolbar-position="right"] {
        flex-direction: row;
      }

      :host[toolbar-position="left"] paper-toolbar paper-progress,
      :host[toolbar-position="right"] paper-toolbar paper-progress {
        inset: auto;

        position: fixed;
        left: 0;
        bottom: 0;
        width: 100%;
      }

      :host[toolbar-position="left"] .title span,
      :host[toolbar-position="right"] .title span {
        display: none;
      }

      :host[toolbar-position="top"] #mini-stats,
      :host[toolbar-position="bottom"] #mini-stats {
        display: none;
      }

      /* Media queries */

      @media (max-width: 600px) {
        .settings-list h3,
        .settings-list .settings-item {
          padding-left: 4px;
          padding-right: 4px;
        }

        .settings-list .settings-item paper-dropdown-menu {
          width: 150px;
        }

        .settings-list .settings-item paper-slider {
          width: 165px;
        }

        paper-dialog ul ul {
          /* Remove stock indentation of nested <ul>s */
          padding: 0;
        }

        :host[toolbar-position="left"],
        :host[toolbar-position="right"] {
          --vertical-toolbar-width: 48px;
        }

        /* Slightly larger toolbar icons on top/bottom docks */
        :host[toolbar-position="top"] #toolbar paper-menu-button,
        :host[toolbar-position="top"] #toolbar paper-icon-button,
        :host[toolbar-position="bottom"] #toolbar paper-menu-button,
        :host[toolbar-position="bottom"] #toolbar paper-icon-button {
          padding: 6px;
        }
      }
    </style>

    <div class="content">
      <zoom-container
          id="container"
          dimensions="800/600"
          pannable="{{pannable}}"
          panning="{{panning}}"
          zoom="{{zoom}}"
          percent-zoom="{{percentZoom}}"
          stepped-zoom="{{steppedZoom}}"
          enable-scroll-zooming="{{enableScrollZooming}}">
          <sketch-canvas
              id="sketch"
              ink="{{ink}}"
              tool="{{tool}}"
              playing="{{playing}}"
              can-undo="{{canUndo}}"
              can-redo="{{canRedo}}"
              etch-mode="{{etchMode}}"
              line-step="{{lineStep}}"
              fill-angle="{{fillAngle}}"
              fill-spacing="{{fillSpacing}}"
              tone-pattern="{{tonePattern}}"
              tone-radius="{{toneRadius}}"
              tone-spacing="{{toneSpacing}}"
              tone-offset-x="{{toneOffsetX}}"
              tone-offset-y="{{toneOffsetY}}"
              fill-screentone="{{fillScreentone}}"
              eraser-radius="{{eraserRadius}}"
              erase-strokes-setting="{{eraseStrokes}}"
              ignore-touch="{{sketchIgnoreTouch}}"
              time-resolution="{{timeResolution}}"
              animation-speed="{{animationSpeed}}"
              limited-ink="{{limitedInk}}"
              render-type="{{renderType}}"
              max-data-length="{{maxDataLength}}"
              on-tool-changed="_closeMenus"
              drawing="{{drawing}}"
              flipped="{{sketchFlipped}}"
              disabled="{{sketchDisabled}}"></sketch-canvas>
      </zoom-container>
      <paper-dialog
          id="alertToast"
          class="toast"
          tabindex=""
          exit-animation="fade-out-animation"
          no-cancel-on-outside-click
          no-cancel-on-esc-key>
          <span id="alertToastMessage"></span>
      </paper-dialog>
      <paper-fab
          title="{{localize('swap')}}"
          icon="send"
          hidden="{{hideSwap}}"
          disabled="{{swapDisabled}}"
          on-tap="_swap"></paper-fab>
    </div>

    <paper-dialog id="keybindDialog" with-backdrop>
        <h2>Keyboard shortcuts and controls</h2>
        <paper-dialog-scrollable>
            <marked-element>
                <div class="markdown-html"></div>
                <script type="text/markdown" src="./keybinds.md"></script>
            </marked-element>
        </paper-dialog-scrollable>
        <div class="buttons">
            <paper-button dialog-dismiss autofocus>Close</paper-button>
        </div>
    </paper-dialog>

    <paper-dialog id="changelogs" with-backdrop>
        <h2>Changelogs</h2>
        <paper-dialog-scrollable>
            <marked-element id="changelogsContent">
                <div class="markdown-html"></div>
                <!-- Placeholder text while we're fetching changelogs -->
                <script type="text/markdown">
                    No changes. None of them. This client has always been like this.
                    Nothing's changed, because it's always been the same.
                    If you really think anything's changed, you might have to ask God.
                </script>
            </marked-element>
        </paper-dialog-scrollable>
        <div class="buttons">
            <paper-button dialog-dismiss autofocus>Close</paper-button>
        </div>
    </paper-dialog>

    <paper-dialog
        id="captchaDialog"
        modal
        on-iron-overlay-closed="_onCaptchaDialogClosed"
        on-iron-overlay-opened="_onCaptchaDialogOpened">
        <h2>Swapping</h2>
        <paper-dialog-scrollable>
            <div class="captcha-card">
                <img id="captchaImage" src="[[captchaURL]]" alt="A noz.rip CAPTCHA.">
                <paper-input
                    id="captcha"
                    value="{{captchaPhrase::input}}"
                    maxlength="5"
                    required
                    autofocus
                    auto-validate
                    no-label-float
                    placeholder="Enter captcha"
                    error-message="This field must be filled!"></paper-input>
            </div>
            <p>Before swapping to noz.rip, you must first fill out the captcha.</p>
        </paper-dialog-scrollable>
        <div class="buttons">
            <paper-button
                class="icon"
                title="Invert"
                on-tap="_invertCaptcha">
                <iron-icon item-icon icon="invert-colors"></iron-icon>
            </paper-button>
            <paper-button dialog-dismiss>Back</paper-button>
            <paper-button
                on-tap="_submitCaptcha"
                dialog-confirm>Swap</paper-button>
        </div>
    </paper-dialog>

    <paper-dialog id="settings" with-backdrop>
        <h2>Settings</h2>
        <paper-dialog-scrollable class="settings-list">
            <h3>General</h3>
            <paper-item class="settings-item">
                <paper-item-body two-line>
                    <div>Toggle tool settings with keybind</div>
                    <div secondary>
                        Whether tool keybinds should open/close their
                        respective tools' settings or not.
                    </div>
                </paper-item-body>
                <paper-toggle-button
                    checked="{{keybindToggling}}"
                    noink></paper-toggle-button>
            </paper-item>
            <paper-item class="settings-item">
                <paper-item-body two-line>
                    <div>Automatically save sketch and history</div>
                    <div secondary>
                        Whether sketches and undo history should be autosaved
                        and restored on a new tab, or not.
                    </div>
                </paper-item-body>
                <paper-toggle-button
                    checked="{{autosave}}"
                    noink></paper-toggle-button>
            </paper-item>
            <paper-item class="settings-item">
                <paper-item-body two-line>
                    <div>Prevent drawing past ink limit</div>
                    <div secondary>
                      Note: Even if this is turned off, swapping will still
                      clip the sketch to 100%.
                    </div>
                </paper-item-body>
                <paper-toggle-button
                    checked="{{limitedInk}}"
                    noink></paper-toggle-button>
            </paper-item>
            <paper-item class="settings-item">
                <paper-item-body two-line>
                    <div>Ignore touch inputs</div>
                    <div secondary>
                        Whether finger taps on the canvas should be ignored
                        or not. Useful for tablet users using EMR styluses.
                    </div>
                </paper-item-body>
                <paper-toggle-button
                    checked="{{sketchIgnoreTouch}}"
                    noink></paper-toggle-button>
            </paper-item>
            <paper-item class="settings-item">
                <paper-item-body two-line>
                    <div>Enable scroll zooming</div>
                    <div secondary>
                        Whether scrolling on the canvas should zoom it in or
                        not. Disable this if your device has its own zooming
                        powered by scrolling, e.g. some laptop touchpads.
                    </div>
                </paper-item-body>
                <paper-toggle-button
                    checked="{{enableScrollZooming}}"
                    noink></paper-toggle-button>
            </paper-item>
            <paper-item class="settings-item">
                <paper-item-body two-line>
                    <div>Zoom in discrete steps</div>
                    <div secondary>
                        Zooming would start going on discrete percentages,
                        e.g. 66.6%, 100%, 200%, etc. This will not apply for
                        pinch-zooming.
                    </div>
                </paper-item-body>
                <paper-toggle-button
                    checked="{{steppedZoom}}"
                    noink></paper-toggle-button>
            </paper-item>
            <paper-item class="settings-item dropdown">
                <paper-item-body two-line>
                    <div>Gallery</div>
                    <div secondary>The gallery to swap sketches onto.</div>
                </paper-item-body>
                <paper-dropdown-menu
                    dynamic-align
                    no-label-float>
                    <paper-listbox
                        class="dropdown-content"
                        selected="{{gallery}}"
                        attr-for-selected="value">
                        <paper-item value="garyc.me">garyc.me</paper-item>
                        <paper-item value="noz.rip">noz.rip</paper-item>
                    </paper-listbox>
                </paper-dropdown-menu>
            </paper-item>

            <hr>
            <h3>App appearance</h3>
            <paper-item class="settings-item dropdown">
                <paper-item-body two-line>
                    <div>Background</div>
                    <div secondary>Page background of the app</div>
                </paper-item-body>
                <paper-dropdown-menu
                    dynamic-align
                    no-label-float>
                    <paper-listbox
                        class="dropdown-content"
                        selected="{{backgroundType}}"
                        attr-for-selected="value">
                        <paper-item value="light">Light</paper-item>
                        <paper-item value="dark">Dark</paper-item>
                    </paper-listbox>
                </paper-dropdown-menu>
            </paper-item>
            <paper-item class="settings-item dropdown">
                <paper-item-body two-line>
                    <div>Toolbar position</div>
                    <div secondary>Where the toolbar should be docked on</div>
                </paper-item-body>
                <paper-dropdown-menu
                    dynamic-align
                    no-label-float>
                    <paper-listbox
                        class="dropdown-content"
                        selected="{{toolbarPosition}}"
                        attr-for-selected="value">
                        <paper-item value="top">Top</paper-item>
                        <paper-item value="left">Left</paper-item>
                        <paper-item value="right">Right</paper-item>
                        <paper-item value="bottom">Bottom</paper-item>
                    </paper-listbox>
                </paper-dropdown-menu>
            </paper-item>
            <paper-item class="settings-item dropdown">
                <paper-item-body two-line>
                    <div>Rendering style</div>
                    <div secondary>How sketches are rendered on the canvas</div>
                </paper-item-body>
                <paper-dropdown-menu
                    dynamic-align
                    no-label-float>
                    <paper-listbox
                        class="dropdown-content"
                        selected="{{renderType}}"
                        attr-for-selected="value">
                        <paper-item
                            label="Default"
                            value="round">
                            <paper-item-body two-line>
                                <div>Default</div>
                                <div secondary>
                                    Round line tips, round corner edges.
                                </div>
                            </paper-item-body>
                        </paper-item>
                        <paper-item
                            label="Gallery-style"
                            value="gallery">
                            <paper-item-body two-line>
                                <div>Gallery-style</div>
                                <div secondary>
                                    Hard line tips, round corner edges.
                                    Similar to garyc.me's.
                                </div>
                            </paper-item-body>
                        </paper-item>
                        <paper-item
                            label="Gallery-style (spiky)"
                            value="gallery-miter">
                            <paper-item-body two-line>
                                <div>Gallery-style (spiky)</div>
                                <div secondary>
                                    Hard line tips, spiky corner edges.
                                    Similar to garyc.me's before 2022.
                                </div>
                            </paper-item-body>
                        </paper-item>
                    </paper-listbox>
                </paper-dropdown-menu>
            </paper-item>
            <paper-item class="settings-item slider">
                <paper-item-body two-line>
                    <div>Animation speed</div>
                    <div secondary>
                        How fast sketches would be played back
                        on peeks and swaps
                    </div>
                </paper-item-body>
                <paper-slider
                    value="{{animationSpeed}}"
                    min="5"
                    max="30"
                    editable></paper-slider>
            </paper-item>
            <paper-item class="settings-item">
                <paper-item-body two-line>
                    <div>Use compact actions menu</div>
                    <div secondary>Shrinks the actions menu into just the icons.</div>
                </paper-item-body>
                <paper-toggle-button
                    checked="{{compactButtons}}"
                    noink></paper-toggle-button>
            </paper-item>
            <paper-item class="settings-item">
                <paper-item-body two-line>
                    <div>Hide swap button</div>
                    <div secondary>Note: Swapping can still be done with Ctrl+Enter.</div>
                </paper-item-body>
                <paper-toggle-button
                    checked="{{hideSwap}}"
                    noink></paper-toggle-button>
            </paper-item>
        </paper-dialog-scrollable>
        <div class="buttons">
            <paper-button dialog-dismiss autofocus>Close</paper-button>
        </div>
    </paper-dialog>

    <paper-toolbar id="toolbar">
      <paper-progress
          class="fit"
          hidden="{{!loading}}"
          indeterminate></paper-progress>

      <paper-icon-button
          title="{{localize('reset')}}"
          icon="delete"
          disabled="{{_resetDisabled(sketchDisabled, loading, canUndo, ink)}}"
          on-tap="_reset"></paper-icon-button>
      <paper-icon-button
          title="{{localize('undo')}}"
          icon="undo"
          disabled="{{_undoDisabled(sketchDisabled, loading, canUndo, undoDisabled)}}"
          on-tap="_undo"></paper-icon-button>
      <paper-icon-button
          title="{{localize('redo')}}"
          icon="redo"
          disabled="{{_editDisabled(loading, canRedo)}}"
          on-tap="_redo"></paper-icon-button>
      <paper-menu-button
          id="menuPan"
          disabled="{{_toolDisabled(sketchDisabled, loading)}}"
          dynamic-align
          allow-outside-scroll
          vertical-align="bottom"
          vertical-offset="48"
          on-opened-changed="_pan">
          <paper-icon-button
              class="dropdown-trigger"
              title="{{localize('pan')}}"
              icon="mdi:hand-back-right"
              active="{{_isPanning(tool)}}"
              toggles="{{!_isPanning(tool)}}"></paper-icon-button>
          <div class="dropdown-content settings">
              <h3>Panning</h3>
              <paper-item class="settings-item zoom-setting">
                  <paper-item-body two-line>
                      <div>Zoom</div>
                      <div secondary>Zoom level, in %</div>
                  </paper-item-body>
                  <div class="zoom-buttons">
                      <paper-icon-button
                          icon="remove"
                          title="Zoom out"
                          disabled="{{_zoomOutDisabled(zoom)}}"
                          on-tap="_zoomOut"></paper-icon-button>
                      <paper-input
                          type="number"
                          step="5"
                          min="20"
                          max="1000"
                          value="{{percentZoom}}"
                          on-change="_updatePercentZoom"
                          no-label-float>
                          <div suffix>%</div>
                      </paper-input>
                      <paper-icon-button
                          icon="add"
                          title="Zoom in"
                          disabled="{{_zoomInDisabled(zoom)}}"
                          on-tap="_zoomIn"></paper-icon-button>
                  </div>
              </paper-item>
              <paper-icon-item
                  class="button-item"
                  on-tap="_fit">
                      <iron-icon item-icon icon="mdi:fit-to-screen-outline"></iron-icon>
                      <div>Fit canvas to screen</div>
              </paper-icon-item>
          </div>
      </paper-menu-button>
      <paper-menu-button
          id="menuEraser"
          disabled="{{_toolDisabled(sketchDisabled, loading)}}"
          dynamic-align
          allow-outside-scroll
          vertical-align="bottom"
          vertical-offset="48"
          on-opened-changed="_erase">
          <paper-icon-button
              class="dropdown-trigger"
              title="{{localize('eraser')}}"
              icon="mdi:eraser-variant"
              active="{{_isErasing(tool)}}"
              toggles="{{!_isErasing(tool)}}"></paper-icon-button>
          <div class="dropdown-content settings">
              <h3>Eraser</h3>
              <paper-item class="settings-item">
                  <paper-item-body two-line>
                      <div>Erase strokes</div>
                      <div secondary>
                        Erases entire lines instead of line corners. Holding
                        down Shift while erasing also activates this.
                      </div>
                  </paper-item-body>
                  <paper-toggle-button
                      checked="{{eraseStrokes}}"
                      noink></paper-toggle-button>
              </paper-item>
              <paper-item class="settings-item slider">
                  <paper-item-body two-line>
                      <div>Radius</div>
                      <div secondary>Brush size, in px</div>
                  </paper-item-body>
                  <paper-slider
                      value="{{eraserRadius}}"
                      min="1"
                      max="50"
                      editable></paper-slider>
              </paper-item>
          </div>
      </paper-menu-button>
      <paper-icon-button
          title="{{localize('move')}}"
          icon="mdi:cursor-move"
          disabled="{{_toolDisabled(sketchDisabled, loading)}}"
          active="{{_isMoving(tool)}}"
          toggles="{{!_isMoving(tool)}}"
          on-tap="_move"></paper-icon-button>
      <paper-icon-button
          title="{{localize('pen')}}"
          icon="create"
          disabled="{{_toolDisabled(sketchDisabled, loading)}}"
          active="{{_isDrawing(tool)}}"
          toggles="{{!_isDrawing(tool)}}"
          on-tap="_draw"></paper-icon-button>
      <paper-menu-button
          id="menuFill"
          disabled="{{_toolDisabled(sketchDisabled, loading)}}"
          dynamic-align
          allow-outside-scroll
          ignore-select
          vertical-align="bottom"
          vertical-offset="48"
          on-opened-changed="_fill">
          <paper-icon-button
              class="dropdown-trigger"
              title="{{localize('fill')}}"
              icon="editor:format-color-fill"
              active="{{_isFilling(tool)}}"
              toggles="{{!_isFilling(tool)}}"></paper-icon-button>
          <div class="dropdown-content settings">
              <h3>Filling</h3>
              <paper-item class="settings-item">
                  <paper-item-body two-line>
                      <div>Screentone</div>
                      <div secondary>Fills regions with screentone instead of solid black.</div>
                  </paper-item-body>
                  <paper-toggle-button
                      checked="{{fillScreentone}}"
                      noink></paper-toggle-button>
              </paper-item>

              <hr>
              <template is="dom-if" if="[[!fillScreentone]]">
              <paper-item class="settings-item slider">
                  <paper-item-body two-line>
                      <div>Angle</div>
                      <div secondary>Angle of the fill lines, in degrees</div>
                  </paper-item-body>
                  <paper-slider
                      value="{{fillAngle}}"
                      min="-90"
                      max="90"
                      step="45"
                      editable></paper-slider>
              </paper-item>
              <paper-item class="settings-item slider">
                  <paper-item-body two-line>
                      <div>Spacing</div>
                      <div secondary>Space between fill lines, in px</div>
                  </paper-item-body>
                  <paper-slider
                      value="{{fillSpacing}}"
                      min="1"
                      max="20"
                      editable></paper-slider>
              </paper-item>
              </template>
              <template is="dom-if" if="[[fillScreentone]]">
              <h3>Screentoning</h3>
              <paper-item class="settings-item dropdown">
                  <paper-item-body two-line>
                      <div>Pattern</div>
                      <div secondary>Layout of the screentones</div>
                  </paper-item-body>
                  <paper-dropdown-menu
                      dynamic-align
                      no-label-float>
                      <paper-listbox
                          class="dropdown-content"
                          selected="{{tonePattern}}"
                          attr-for-selected="value">
                          <paper-icon-item value="normal">
                              <iron-icon
                                  item-icon
                                  icon="handmade:tone-normal"></iron-icon>
                              <div>Normal</div>
                          </paper-icon-item>
                          <paper-icon-item value="diagonal">
                              <iron-icon
                                  item-icon
                                  icon="handmade:tone-diagonal"></iron-icon>
                              <div>Diagonal</div>
                          </paper-icon-item>
                      </paper-listbox>
                  </paper-dropdown-menu>
              </paper-item>
              <paper-item class="settings-item slider">
                  <paper-item-body two-line>
                      <div>Spacing</div>
                      <div secondary>Space between tones, in px</div>
                  </paper-item-body>
                  <paper-slider
                      value="{{toneSpacing}}"
                      min="2"
                      max="40"
                      editable></paper-slider>
              </paper-item>
              <h3>Screentone Offset</h3>
              <div class="settings-double">
                  <paper-item class="settings-item slider">
                      <paper-item-body two-line>
                          <div>X</div>
                          <div secondary>(in px)</div>
                      </paper-item-body>
                      <paper-slider
                          value="{{toneOffsetX}}"
                          min="-20"
                          max="20"
                          editable></paper-slider>
                  </paper-item>
                  <paper-item class="settings-item slider">
                      <paper-item-body two-line>
                          <div>Y</div>
                          <div secondary>(in px)</div>
                      </paper-item-body>
                      <paper-slider
                          value="{{toneOffsetY}}"
                          min="-20"
                          max="20"
                          editable></paper-slider>
                  </paper-item>
              </template>
              </div>
          </div>
      </paper-menu-button>
      <paper-menu-button
          id="menuScreentone"
          disabled="{{_toolDisabled(sketchDisabled, loading)}}"
          dynamic-align
          allow-outside-scroll
          ignore-select
          vertical-align="bottom"
          vertical-offset="48"
          on-opened-changed="_screentone">
          <paper-icon-button
              class="dropdown-trigger"
              title="{{localize('screentone')}}"
              icon="editor:border-clear"
              active="{{_isToning(tool)}}"
              toggles="{{!_isToning(tool)}}"></paper-icon-button>
          <div class="dropdown-content settings">
              <h3>Screentoning</h3>
              <paper-item class="settings-item dropdown">
                  <paper-item-body two-line>
                      <div>Pattern</div>
                      <div secondary>Layout of the screentones</div>
                  </paper-item-body>
                  <paper-dropdown-menu
                      dynamic-align
                      no-label-float>
                      <paper-listbox
                          class="dropdown-content"
                          selected="{{tonePattern}}"
                          attr-for-selected="value">
                          <paper-icon-item value="normal">
                              <iron-icon
                                  item-icon
                                  icon="handmade:tone-normal"></iron-icon>
                              <div>Normal</div>
                          </paper-icon-item>
                          <paper-icon-item value="diagonal">
                              <iron-icon
                                  item-icon
                                  icon="handmade:tone-diagonal"></iron-icon>
                              <div>Diagonal</div>
                          </paper-icon-item>
                      </paper-listbox>
                  </paper-dropdown-menu>
              </paper-item>
              <div class="settings-double">
                  <paper-item class="settings-item slider">
                      <paper-item-body two-line>
                          <div>Spacing</div>
                          <div secondary>(in px)</div>
                      </paper-item-body>
                      <paper-slider
                          value="{{toneSpacing}}"
                          min="2"
                          max="40"
                          editable></paper-slider>
                  </paper-item>
                  <paper-item class="settings-item slider">
                      <paper-item-body two-line>
                          <div>Radius</div>
                          <div secondary>(in px)</div>
                      </paper-item-body>
                      <paper-slider
                          value="{{toneRadius}}"
                          min="1"
                          max="20"
                          editable></paper-slider>
                  </paper-item>
              </div>
              <h3>Screentone Offset</h3>
              <div class="settings-double">
                  <paper-item class="settings-item slider">
                      <paper-item-body two-line>
                          <div>X</div>
                          <div secondary>(in px)</div>
                      </paper-item-body>
                      <paper-slider
                          value="{{toneOffsetX}}"
                          min="-20"
                          max="20"
                          editable></paper-slider>
                  </paper-item>
                  <paper-item class="settings-item slider">
                      <paper-item-body two-line>
                          <div>Y</div>
                          <div secondary>(in px)</div>
                      </paper-item-body>
                      <paper-slider
                          value="{{toneOffsetY}}"
                          min="-20"
                          max="20"
                          editable></paper-slider>
                  </paper-item>
              </div>
          </div>
      </paper-menu-button>
      <paper-menu-button
          id="settingsButton"
          dynamic-align
          allow-outside-scroll
          ignore-select
          vertical-align="bottom"
          vertical-offset="48">
          <paper-icon-button
              class="dropdown-trigger"
              title="{{localize('settings')}}"
              icon="settings"></paper-icon-button>
          <div class="dropdown-content settings">
              <h3>Actions</h3>
              <section class="button-row">
              <paper-icon-item
                  class="button-item"
                  on-tap="_flip">
                  <template is="dom-if" if="[[!sketchFlipped]]">
                      <iron-icon item-icon icon="image:flip"></iron-icon>
                      <div>Flip canvas horizontally</div>
                  </template>
                  <template is="dom-if" if="[[sketchFlipped]]">
                      <iron-icon item-icon class="flipped" icon="image:flip"></iron-icon>
                      <paper-item-body two-line>
                          <div>Flip canvas horizontally</div>
                          <div secondary>
                              Currently flipped.
                          </div>
                      </paper-item-body>
                  </template>
              </paper-icon-item>
              <template is="dom-if" if="[[!playing]]">
                  <paper-icon-item
                      disabled="[[!ink]]"
                      class="button-item"
                      on-tap="_play">
                          <iron-icon item-icon icon="av:play-arrow"></iron-icon>
                          <div>Play sketch animation</div>
                  </paper-icon-item>
              </template>
              <template is="dom-if" if="[[playing]]">
                  <paper-icon-item
                      class="button-item"
                      on-tap="_stop">
                          <iron-icon item-icon icon="av:stop"></iron-icon>
                          <div>Stop sketch animation</div>
                  </paper-icon-item>
              </template>
              <paper-icon-item
                  class="button-item"
                  on-tap="_copy">
                      <iron-icon item-icon icon="content-copy"></iron-icon>
                      <div>Copy sketch data</div>
              </paper-icon-item>
              <paper-icon-item
                  disabled="[[_clipboardReadTextDisabled]]"
                  class="button-item"
                  on-tap="_paste">
                  <iron-icon item-icon icon="content-paste"></iron-icon>
                  <template is="dom-if" if="[[!_clipboardReadTextDisabled]]">
                      <div>Paste sketch data</div>
                  </template>
                  <template is="dom-if" if="[[_clipboardReadTextDisabled]]">
                      <paper-item-body two-line>
                          <div>Paste sketch data</div>
                          <div secondary>
                              Pasting on Firefox can only be done with Ctrl+V.
                          </div>
                      </paper-item-body>
                  </template>
              </paper-icon-item>
              <paper-icon-item
                  class="button-item"
                  on-tap="_fullscreen">
                  <iron-icon item-icon icon="fullscreen"></iron-icon>
                  <div>Toggle fullscreen</div>
              </paper-icon-item>
              </section>

              <hr>
              <h3>General</h3>
              <paper-item class="settings-item slider">
                  <paper-item-body two-line>
                      <div>Sample rate</div>
                      <div secondary>Input latency, in ms</div>
                  </paper-item-body>
                  <paper-slider
                      value="{{timeResolution}}"
                      min="0"
                      max="50"
                      editable></paper-slider>
              </paper-item>
              <paper-icon-item
                  class="button-item"
                  on-tap="_openKeybindMenu">
                  <iron-icon item-icon icon="font-download"></iron-icon>
                  <div>Open keyboard shortcuts menu</div>
              </paper-icon-item>
              <paper-icon-item
                  class="button-item"
                  on-tap="_openChangelogs">
                  <iron-icon item-icon icon="mdi:list-box-outline"></iron-icon>
                  <div>Open changelogs</div>
              </paper-icon-item>
              <paper-icon-item
                  class="button-item"
                  on-tap="_openSettings">
                  <iron-icon item-icon icon="settings"></iron-icon>
                  <div>Show all settings</div>
              </paper-icon-item>

              <template is="dom-if" if="[[konami]]">
              <hr>
              <h3>Hidden settings</h3>
              <paper-item class="settings-item">
                  <paper-item-body two-line>
                      <div>Etch-a-Sketch mode</div>
                      <div secondary>
                        Draws with the arrow keys instead of a mouse/pen.
                      </div>
                  </paper-item-body>
                  <paper-toggle-button
                      checked="{{etchMode}}"
                      noink></paper-toggle-button>
              </paper-item>
              <paper-item class="settings-item slider">
                  <paper-item-body two-line>
                      <div>Etch: Line step</div>
                      <div secondary>Line length per step, in px</div>
                  </paper-item-body>
                  <paper-slider
                      value="{{lineStep}}"
                      max="20"
                      min="1"
                      disabled="{{!etchMode}}"
                      editable></paper-slider>
              </paper-item>
              </template>
          </div>
      </paper-menu-button>

      <div class="title">
          <span>{{localize('ink', 'amount', flooredInk)}}</span>
          <span id="alert"></span>
          <div class="stats">
              <span title="{{localize('tooltipSketches')}}">{{localize('sketches', 'num', sketches)}}</span>
              <span title="{{localize('tooltipArtists')}}">{{localize('artists', 'num', artists)}}</span>
              <span title="{{localize('tooltipPeekers')}}">{{localize('peekers', 'num', peekers)}}</span>
          </div>
      </div>
      <div id="mini-stats">
          <div class="mini-stats-block white" title="{{localize('tooltipInk')}}">
              {{localize('shortInk', 'amount', flooredInk)}}
          </div>
          <div
              class="mini-stats-block"
              title="{{localize('tooltipStats', 's', sketches, 'a', artists, 'p', peekers)}}">
              {{localize('shortSketches', 'num', sketches)}}
          </div>
      </div>

      <paper-icon-button
          title="{{localize('peek')}}"
          icon="visibility"
          disabled="{{loading}}"
          on-tap="_peek"></paper-icon-button>
      <paper-icon-button
          title="{{_viewGalleryTitle(localize, peekID)}}"
          icon="view-module"
          on-tap="_viewGallery"></paper-icon-button>
      <paper-menu-button
          dynamic-align
          vertical-align="bottom"
          vertical-offset="48">
          <paper-icon-button
              class="dropdown-trigger"
              title="{{localize('save')}}"
              icon="save"></paper-icon-button>
          <div class="dropdown-content menu">
              <h3>Saving</h3>
              <paper-icon-item
                  class="button-item"
                  on-tap="_save">
                  <iron-icon item-icon icon="save"></iron-icon>
                  <div>Save as PNG</div>
              </paper-icon-item>
              <paper-icon-item
                  class="button-item"
                  on-tap="_saveSVG">
                  <iron-icon item-icon icon="mdi:content-save-cog"></iron-icon>
                  <div>Save as SVG</div>
              </paper-icon-item>
              <paper-icon-item
                  disabled="[[!ink]]"
                  class="button-item"
                  on-tap="_saveTXT">
                  <iron-icon item-icon icon="mdi:file-document-outline"></iron-icon>
                  <div>Save data as TXT</div>
              </paper-icon-item>
          </div>
      </paper-menu-button>
    </paper-toolbar>

    <iron-a11y-keys
        target="[[target]]"
        keys="ctrl+z meta+z"
        on-keys-pressed="_undo"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="ctrl+y meta+y"
        on-keys-pressed="_redo"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="ctrl+s meta+s"
        on-keys-pressed="_save"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="delete"
        on-keys-pressed="_reset"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="s"
        on-keys-pressed="_screentone"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="h"
        on-keys-pressed="_pan"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="e"
        on-keys-pressed="_erase"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="m"
        on-keys-pressed="_move"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="b p"
        on-keys-pressed="_draw"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="f"
        on-keys-pressed="_fill"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="ctrl+enter meta+enter"
        on-keys-pressed="_swap"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="ctrl+c meta+c"
        on-keys-pressed="_copy"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="ctrl+v meta+v"
        on-keys-pressed="_paste"></iron-a11y-keys>
    <iron-a11y-keys

    <iron-a11y-keys

        keys="- _ = +"

    <iron-a11y-keys

        on-keys-pressed="_resetZoom"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="down"
        on-keys-pressed="_flip"></iron-a11y-keys>
    <iron-a11y-keys
        target="[[target]]"
        keys="tab"
        on-keys-pressed="_hideUI"></iron-a11y-keys>
    <iron-a11y-keys

        keys="up down left right"

    <iron-a11y-keys

    <iron-a11y-keys
